<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인정보처리방침 - 건보지킴이</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; max-width: 600px; margin: 0 auto; padding: 30px 20px; font-size: 16px; line-height: 1.8; color: #333; }
    h1 { font-size: 22px; margin-bottom: 30px; }
    h2 { font-size: 18px; margin: 24px 0 8px; }
  </style>
</head>
<body>
  <h1>개인정보처리방침</h1>
  <p>건보지킴이 서비스 운영자는 아래와 같이 개인정보를 처리합니다.</p>

  <h2>1. 수집하는 개인정보 항목</h2>
  <p>이름, 연락처 (전화번호)</p>

  <h2>2. 개인정보 수집 목적</h2>
  <p>세무 상담 연결을 위한 용도로만 사용됩니다.</p>

  <h2>3. 보유 및 이용 기간</h2>
  <p>상담 연결 완료 후 즉시 파기합니다.</p>

  <h2>4. 제3자 제공</h2>
  <p>수집된 개인정보는 제3자에게 제공되지 않습니다.</p>

  <h2>5. 계산기 입력 정보</h2>
  <p>소득 및 재산 입력 정보는 서버에 저장되지 않습니다. 계산은 사용자 기기에서만 처리되며 외부로 전송되지 않습니다.</p>

  <h2>6. 문의</h2>
  <p>이메일: (본인 이메일 입력)</p>
</body>
</html>
